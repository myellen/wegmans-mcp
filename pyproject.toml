[project]
name = "wegmans-mcp"
version = "0.3.0"
description = "MCP server for Wegmans Meals2Go cart manipulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "playwright>=1.49.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "websockets>=17.0.1",
]

[project.scripts]
wegmans-mcp = "wegmans_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wegmans_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
